<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="noteapp.css">
    <title>Note App</title>
</head>
<body>
    <header id="header">
        <h1>
          📝 My Notes
        </h1>
    </header>
        <main id="mainEl">
            <div id="noteForm">
                <input type="text" id="titleInput" placeholder="Add Title..">
                <textarea id="noteInput" placeholder="Enter your Note.."></textarea>
                <p id="errorMessage"></p>
                <button id="addButton">Add</button>
            </div>
            <div id="notesSection">

               <input
                type="text"
                id="searchInput"
                 placeholder="🔍 Search notes...">
                 
            <div id="notesContainer">
               

            </div>
            </div>
    




        </main>






    <script src="noteapp.js"></script>
</body>
</html>
